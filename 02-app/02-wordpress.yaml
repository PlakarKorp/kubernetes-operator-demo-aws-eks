---
apiVersion: "v1"
kind: "PersistentVolumeClaim"
metadata:
  name: "mariadb-pvc"
spec:
  accessModes:
    - "ReadWriteOnce"
  resources:
    requests:
      storage: "1Gi"

---
apiVersion: "apps/v1"
kind: "Deployment"
metadata:
  name: "mariadb-deployment"
  labels:
    app: "mariadb"
spec:
  replicas: 1
  strategy:
    type: "Recreate"
  selector:
    matchLabels:
      app: "mariadb"
  template:
    metadata:
      labels:
        app: "mariadb"
    spec:
      containers:
        - name: "mariadb"
          image: "mariadb:latest"
          ports:
            - name: "mysql"
              containerPort: 3306
          # Hard-coded for this demo. Use Kubernetes Secrets for real apps.
          env:
            - name: "MARIADB_ROOT_PASSWORD"
              value: "rootpassword"
            - name: "MARIADB_DATABASE"
              value: "wordpress"
            - name: "MARIADB_USER"
              value: "wordpress"
            - name: "MARIADB_PASSWORD"
              value: "wordpress"
          volumeMounts:
            - name: "mariadb-persistent-storage"
              mountPath: "/var/lib/mysql"
      volumes:
        - name: "mariadb-persistent-storage"
          persistentVolumeClaim:
            claimName: "mariadb-pvc"

---
apiVersion: "v1"
kind: "Service"
metadata:
  name: "mariadb-service"
spec:
  selector:
    app: "mariadb"
  ports:
    - port: 3306
      targetPort: 3306

---
apiVersion: "v1"
kind: "PersistentVolumeClaim"
metadata:
  name: "wordpress-pvc"
  labels:
    app: "wordpress"
spec:
  storageClassName: "${K8S_STORAGE_CLASS_NAME}"
  accessModes:
    - "ReadWriteMany"

  resources:
    requests:
      storage: "10Gi"

---
apiVersion: "apps/v1"
kind: "Deployment"
metadata:
  name: "wordpress-deployment"
  labels:
    app: "wordpress"
spec:
  replicas: 2
  strategy:
    type: "Recreate"
  selector:
    matchLabels:
      app: "wordpress"
  template:
    metadata:
      labels:
        app: "wordpress"
    spec:
      containers:
        - name: "wordpress"
          image: "wordpress:latest"
          ports:
            - name: "wordpress"
              containerPort: 80
          # Hard-coded for this demo. Use Kubernetes Secrets for real apps.
          env:
            - name: "WORDPRESS_DB_HOST"
              value: "mariadb-service"
            - name: "WORDPRESS_DB_USER"
              value: "wordpress"
            - name: "WORDPRESS_DB_PASSWORD"
              value: "wordpress"
            - name: "WORDPRESS_DB_NAME"
              value: "wordpress"
          volumeMounts:
            - name: "wordpress-persistent-storage"
              mountPath: "/var/www/html"
      volumes:
        - name: "wordpress-persistent-storage"
          persistentVolumeClaim:
            claimName: "wordpress-pvc"

---
apiVersion: "v1"
kind: "Service"
metadata:
  name: "wordpress-service"
spec:
  selector:
    app: "wordpress"
  ports:
    - port: 80
      targetPort: 80

---
apiVersion: "gateway.networking.k8s.io/v1"
kind: "HTTPRoute"
metadata:
  name: "wordpress"
spec:
  parentRefs:
    - name: "public"
      namespace: "gateway-system"

  hostnames:
    - "${K8S_WORDPRESS_HOSTNAME}"

  rules:
    - matches:
        - path:
            type: "PathPrefix"
            value: "/"

      backendRefs:
        - name: "wordpress-service"
          port: 80
