---
apiVersion: "apps/v1"
kind: "Deployment"
metadata:
  name: "echo"
spec:
  replicas: 1

  selector:
    matchLabels:
      app: "echo"

  template:
    metadata:
      labels:
        app: "echo"

    spec:
      containers:
        - name: "echo"
          image: "hashicorp/http-echo:latest"
          args:
            - "-text=Hello from Kubernetes!"
          ports:
            - containerPort: 5678

---
apiVersion: "v1"
kind: "Service"
metadata:
  name: "echo"
spec:
  selector:
    app: "echo"

  ports:
    - port: 80
      targetPort: 5678

---
apiVersion: "gateway.networking.k8s.io/v1"
kind: "HTTPRoute"
metadata:
  name: "echo"
spec:
  parentRefs:
    - name: "public"
      namespace: "gateway-system"

  hostnames:
    - "${K8S_ECHO_HOSTNAME}"

  rules:
    - matches:
        - path:
            type: "PathPrefix"
            value: "/"

      backendRefs:
        - name: "echo"
          port: 80
