---
# -----------------------------------------------------------------------------
# Provides shared ReadWriteMany storage for WordPress replicas.
# -----------------------------------------------------------------------------

apiVersion: "apps/v1"
kind: "Deployment"
metadata:
  name: "nfs-server"

spec:
  replicas: 1

  selector:
    matchLabels:
      app: "nfs-server"

  template:
    metadata:
      labels:
        app: "nfs-server"

    spec:
      containers:
        - name: "nfs-server"
          image: "itsthenetwork/nfs-server-alpine:latest"

          securityContext:
            privileged: true

          env:
            - name: "SHARED_DIRECTORY"
              value: "/exports"

          ports:
            - name: "nfs"
              containerPort: 2049

          volumeMounts:
            - name: "nfs-data"
              mountPath: "/exports"

      volumes:
        - name: "nfs-data"
          emptyDir: {}

---
apiVersion: "v1"
kind: "Service"
metadata:
  name: "nfs-server"

spec:
  selector:
    app: "nfs-server"

  ports:
    - name: "nfs"
      port: 2049
      targetPort: 2049

---
apiVersion: "storage.k8s.io/v1"
kind: "StorageClass"
metadata:
  name: "nfs-csi"

provisioner: "nfs.csi.k8s.io"

parameters:
  server: "nfs-server.default.svc.cluster.local"
  share: "/"

reclaimPolicy: "Delete"
volumeBindingMode: "Immediate"
allowVolumeExpansion: true

mountOptions:
  - "nfsvers=4.1"
