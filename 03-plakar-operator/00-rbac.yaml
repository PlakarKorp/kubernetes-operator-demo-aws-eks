---
---
apiVersion: "v1"
kind: "ServiceAccount"
metadata:
  name: "plakar-pvc"

---
apiVersion: "rbac.authorization.k8s.io/v1"
kind: "Role"
metadata:
  name: "plakar-pvc"
rules:
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods/portforward"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list"]

---
apiVersion: "rbac.authorization.k8s.io/v1"
kind: "RoleBinding"
metadata:
  name: "plakar-pvc"
subjects:
  - kind: "ServiceAccount"
    name: "plakar-pvc"
roleRef:
  apiGroup: "rbac.authorization.k8s.io"
  kind: "Role"
  name: "plakar-pvc"
