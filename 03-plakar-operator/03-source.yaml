---
apiVersion: "connector.plakar.io/v1alpha1"
kind: "Source"
metadata:
  name: "wordpress-pvc"
spec:
  endpoint: "/apps/wordpress-pvc"
  protocol: "k8s+pvc"
  integration:
    name: "k8s"
  fields:
    kubeconfig:
      valueFrom:
        secretKeyRef:
          name: "${CLUSTER_NAME}-cluster"
          key: "kubeConfig"

---
apiVersion: "connector.plakar.io/v1alpha1"
kind: "Source"
metadata:
  name: "mariadb-pvc"
spec:
  endpoint: "/apps/mariadb-pvc"
  protocol: "k8s+pvc"
  integration:
    name: "k8s"
  fields:
    kubeconfig:
      valueFrom:
        secretKeyRef:
          name: "${CLUSTER_NAME}-cluster"
          key: "kubeConfig"
